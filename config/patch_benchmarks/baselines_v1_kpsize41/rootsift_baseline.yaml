# RootSIFT Baseline - Color Patches
# Run: ./patch_benchmark ../config/patch_benchmarks/baselines/rootsift_baseline.yaml
#
# RootSIFT applies L1 normalization followed by element-wise square root to SIFT descriptors.
# This typically improves performance on matching tasks.

experiment:
  name: "rootsift_baseline_color"
  description: "RootSIFT baseline on color HPatches patches"

patches:
  path: "../hpatches-release-rebuilt-color/"
  scenes: []
  color: false
  difficulty:
    easy: true
    hard: true
    tough: true

tasks:
  mode: "paper"
  task_source: "csv"
  task_set: "hpatches_color_v1"
  task_split: "full"
  tasks_dir: "../config/patch_benchmarks/tasks/color_tasks"
  matching:
    enabled: true
  verification:
    enabled: true
    num_positives: 200000
    num_negatives: 1000000
    negative_source: "both"
  retrieval:
    enabled: true
    num_queries: 10000
    num_distractors: 20000
  preload_descriptors: true
  preload_scope: "tasks"
  store_descriptors_to_db: false
  use_cached_descriptors: false
  random_seed: 1337

descriptors:
  - name: "rootsift"
    type: "sift"
    use_color: false
    patch_keypoint_size: 12.26
    rooting_stage: "after_pooling"  # L1 norm + sqrt = RootSIFT

performance:
  num_threads: 12
  verbose: true

output:
  save_to_database: true
  print_results: true
